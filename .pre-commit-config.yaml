# Pre-commit hooks for Jotty
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]
        exclude: ^(apps/_archived/|tests/manual/)

  # Lint + import sorting (replaces flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(apps/_archived/|tests/|scripts/|skills/|sdk/|examples/)

  # Basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-c, .bandit.yaml, -r, Jotty/]
        pass_filenames: false

  # Type checking with mypy (strict mode — leverages 100% return type coverage)
  # Fails on: type mismatches, untyped defs, wrong return types, missing annotations
  # Ignores: import-not-found, import-untyped, no-redef (optional deps with try/except)
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy - Strict Type Checking
        entry: bash scripts/mypy_strict_check.sh
        language: system
        pass_filenames: false
        always_run: true

  # Custom Jotty checks
  - repo: local
    hooks:
      - id: python-syntax-check
        name: Python AST Syntax Validation
        entry: python3 -c "import sys, ast; [ast.parse(open(f).read()) for f in sys.argv[1:]]"
        language: system
        types: [python]
        pass_filenames: true

      - id: import-linter
        name: Import Linter - Architecture Enforcement
        entry: bash -c 'lint-imports 2>/dev/null || python3 -m importlinter.cli 2>/dev/null || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: jotty-doctor-imports
        name: Jotty Doctor - Import Check (informational)
        entry: bash -c 'python3 scripts/jotty_doctor.py --imports || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: jotty-doctor-secrets
        name: Jotty Doctor - Security Scan
        entry: python3 scripts/jotty_doctor.py --secrets
        language: system
        pass_filenames: false
        always_run: true

      - id: file-size-check
        name: File Size Check - Detect oversized files
        entry: python3 scripts/analyze_file_size.py --hook
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
