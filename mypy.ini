[mypy]
# Python version
python_version = 3.10

# Global settings
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Allow some flexibility for gradual typing
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_any_generics = False
disallow_subclassing_any = False

# Namespace packages (for skills/ directory)
namespace_packages = True
explicit_package_bases = True

# Where to look for modules
mypy_path = $MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../skills

# Files to exclude
exclude = (?x)(
    ^build/
    | ^dist/
    | ^\.venv/
    | ^venv/
    | /migrations/
    | /__pycache__/
    | /\.mypy_cache/
  )

# ============================================================================
# Per-module overrides for external/optional dependencies
# ============================================================================

# External libraries we don't control
[mypy-pandas_ta.*]
ignore_missing_imports = True

[mypy-tokencost.*]
ignore_missing_imports = True

[mypy-mongodb_memory.*]
ignore_missing_imports = True

[mypy-enhanced_research.*]
ignore_missing_imports = True

[mypy-model_limits_catalog.*]
ignore_missing_imports = True

# Optional skill modules (may use hyphens in directory names)
