# Skill metadata overrides (for skills that need extra info)
skill_metadata:
  claude-cli-llm:
    requires_auth: true
    env_vars: [ANTHROPIC_API_KEY]

  gemini:
    requires_auth: true
    env_vars: [GOOGLE_API_KEY, GEMINI_API_KEY]

  openai-image-gen:
    requires_auth: true
    env_vars: [OPENAI_API_KEY]

  openai-whisper-api:
    requires_auth: true
    env_vars: [OPENAI_API_KEY]

  telegram-sender:
    requires_auth: true
    env_vars: [TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID]

  slack:
    requires_auth: true
    env_vars: [SLACK_BOT_TOKEN]

  discord:
    requires_auth: true
    env_vars: [DISCORD_BOT_TOKEN]

  github:
    requires_auth: true
    env_vars: []
    requires_cli: [gh]

  notion:
    requires_auth: true
    env_vars: [NOTION_API_KEY]

  trello:
    requires_auth: true
    env_vars: [TRELLO_API_KEY, TRELLO_TOKEN]

  n8n-workflows:
    requires_auth: true
    env_vars: [N8N_API_KEY, N8N_BASE_URL]

  spotify:
    requires_auth: true
    env_vars: [SPOTIFY_ACCESS_TOKEN]

