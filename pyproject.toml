[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jotty-ai"
version = "10.0.0"
description = "Production-Ready Multi-Agent RL Wrapper for DSPy - SYnergistic Neural Agent Processing & Self-organizing Execution"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Soham Acharya"},
    {name = "Anshul Chauhan"}
]
keywords = ["dspy", "multi-agent", "reinforcement-learning", "llm", "ai", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
dependencies = [
    "dspy-ai>=2.0.0",
    "pyyaml>=6.0",
    "langgraph>=0.0.1",
]

# Optional dependencies (install with: pip install jotty-ai[all])
[project.optional-dependencies]

# Web server & gateway (FastAPI, WebSocket, webhooks)
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
]

# CLI interactive shell (Rich TUI, prompt toolkit)
cli = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

# Messaging platform integrations
telegram = ["python-telegram-bot>=20.0"]

# Persistence backends
mongodb = ["pymongo>=4.0.0"]
redis = ["redis>=4.0.0"]
sql = ["sqlalchemy>=2.0.0"]

# Everything
all = [
    "jotty-ai[web]",
    "jotty-ai[cli]",
    "jotty-ai[telegram]",
    "jotty-ai[mongodb]",
    "jotty-ai[redis]",
    "jotty-ai[sql]",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "ruff>=0.9.0",
    "mypy>=1.7.0",
    "python-code-analyzer>=1.0.14",
    "import-linter>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/jotty"
Documentation = "https://github.com/yourusername/jotty/docs"
Repository = "https://github.com/yourusername/jotty"
Issues = "https://github.com/yourusername/jotty/issues"

[tool.setuptools]
# Let setup.py handle package discovery since it needs Python expressions

[tool.setuptools.package-data]
"Jotty.core.swarm_prompts" = ["*.md"]
"Jotty.core.validation_prompts" = ["*.md"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
# Strict typing — enabled after 100% return type coverage sweep
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["apps/_archived", "scripts", ".backup", "tests", "skills", "examples"]

[tool.ruff.lint]
# Active rules: E (pycodestyle), F (pyflakes), I (isort replacement)
# Phased-in rules: B (bugbear), RUF (ruff-specific) — enabled with suppressions below
# Each suppressed rule has a reason. Rules marked "fix separately" are real issues
# with pre-existing violations to be cleaned up in dedicated PRs.
select = ["E", "F", "I", "B", "RUF"]
ignore = [
    # --- E/F: Permanent suppressions (intentional patterns) ---
    "E402",    # Module import not at top — intentional (env setup, lazy imports)
    "E501",    # Line too long — handled by Black formatter
    "E741",    # Ambiguous variable name — too noisy for existing codebase
    "F821",    # Undefined name — false positives from quoted type hints / forward refs
    "F811",    # Redefinition — try/except fallback patterns throughout codebase
    # --- E/F: Phase-in candidates (pre-existing, fix in dedicated PR) ---
    "F841",    # Unused variable — 50+ pre-existing
    # --- B: Permanent suppressions (intentional patterns) ---
    "B004",    # Unreliable callable check — too noisy for metaprogramming code
    "B008",    # Function call in default argument — FastAPI Depends() pattern
    "B009",    # get-attr with constant — style preference
    # --- B: Phase-in candidates (pre-existing, fix in dedicated PR) ---
    "B006",    # Mutable default argument — 30+ pre-existing
    "B007",    # Unused loop variable — 20+ pre-existing
    "B023",    # Function uses loop variable — 15+ pre-existing
    "B024",    # ABC without abstract method — 10+ pre-existing
    "B025",    # Duplicate try-block exception — 5+ pre-existing
    "B027",    # Empty method without abstract decorator — 10+ pre-existing
    "B033",    # Duplicate set value — 5+ pre-existing
    "B904",    # Raise without from — 40+ pre-existing
    "B905",    # zip without strict — 20+ pre-existing
    # --- RUF: Permanent suppressions (intentional patterns) ---
    "RUF001",  # Ambiguous unicode in string — emojis are intentional
    "RUF002",  # Ambiguous unicode in docstring — emojis are intentional
    "RUF003",  # Ambiguous unicode in comment — emojis are intentional
    "RUF005",  # Collection literal concat — style preference
    "RUF006",  # Asyncio dangling task — false positives in swarm code
    "RUF022",  # __all__ not sorted — intentionally grouped by category
    # --- RUF: Phase-in candidates (pre-existing, fix in dedicated PR) ---
    "RUF010",  # Use explicit conversion flag — 15+ pre-existing
    "RUF012",  # ClassVar for mutable class attrs — 500+ pre-existing
    "RUF015",  # Unnecessary iterable allocation — 10+ pre-existing
    "RUF019",  # Unnecessary key check — 10+ pre-existing
    "RUF034",  # Useless if-else — 5+ pre-existing
    "RUF059",  # Unused unpacked variable — 62 pre-existing
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]   # Re-exports are intentional
"tests/*" = ["F841", "E712"] # Unused vars and comparison style in tests OK
"skills/*" = ["F401"]        # Skills have conditional imports
"examples/*" = ["F401"]      # Examples may have unused imports for demonstration
"sdk/*" = ["F401"]           # SDK re-exports

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
